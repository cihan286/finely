# Checks every push and pull request: types, lint, tests, database
# migrations, a production build and the end-to-end tests. A pull request
# should only be merged when this passes.

name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to the same branch cancels the run that's still going
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # The build loads the database and auth modules but never connects:
      # placeholders are enough. Real values live in Vercel.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      BETTER_AUTH_SECRET: ci-placeholder-secret-not-used-anywhere
      BETTER_AUTH_URL: http://localhost:3000
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm test

      # Fails when src/db/*.ts changed without `npm run db:generate`
      - name: Migrations match the schema
        run: |
          npm run db:generate
          git add --intent-to-add drizzle
          git diff --exit-code drizzle || {
            echo "::error::The database schema changed but no migration was committed. Run 'npm run db:generate' and commit the new file in drizzle/."
            exit 1
          }

      - name: Build
        run: npm run build

  # Uses the app in a real browser against a real Postgres (see
  # playwright.config.ts): signing up, transactions, imports, teams, billing
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: e2e
          POSTGRES_PASSWORD: e2e
          POSTGRES_DB: finely_e2e
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Install the test browser
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        run: npm run test:e2e

      # What the browser saw when a test failed: open index.html, or a
      # trace with `npx playwright show-trace`
      - name: Keep the test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
